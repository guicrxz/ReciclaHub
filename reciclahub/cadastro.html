<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReciclaHub - Cadastro</title>
    <link rel="stylesheet" href="css/cadastrologin.css">
</head>

<body>

    <div class="login-container">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-icon">
                <img src="img/logo.png" alt="Logo Recicla Hub">
            </div>

            <div>
                <h1>ReciclaHub</h1>
                <span>MAPEAMENTO E COLETA DE MATERIAIS</span>
            </div>

        </div>


        <!-- CADASTRO -->
        <div class="login-box">

            <h2>Crie sua conta!</h2>

            <p>Preencha seus dados para criar sua conta no Recicla Hub.</p>

            <form>

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(11) 99999-9999"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="idade">Idade</label>
                <input
                    type="number"
                    id="idade"
                    placeholder="Digite sua idade"
                    required
                >

                <label for="senha">Criar senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite uma senha"
                    required
                >

                <button type="submit">CRIAR CONTA</button> 
                

            </form>
            

        </div>


        <!-- RODAPÉ -->
        <footer>
            <span>●</span> Sistema Online
            <b>•</b>
            Recicla Hub • Protótipo Feira
        </footer>

    </div>

</body>
</html>
