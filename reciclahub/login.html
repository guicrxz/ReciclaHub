<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReciclaHub - Login</title>

   <link rel="stylesheet" href="css/cadastrologin.css">

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">
                <img src="img/logo.png" alt="Logo EcoRota">
            </div>

            <div>
                <h1>ReciclaHub</h1>
                <span>MAPEAMENTO E COLETA DE MATERIAIS</span>
            </div>

        </div>

        <div class="login-box">

            <h2>Bem-vindo de volta!</h2>

            <p>Entre na sua conta para continuar no ReciclaHub.</p>

            <form>

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <a href="#" class="forgot">
                    Esqueci minha senha
                </a>

                <button type="submit">ENTRAR</button>

                <a href="cadastro.html" class="cadastro">
                    Ainda não tem uma conta? Cadastre-se
                </a>

            </form>

        </div>

        <footer>

            <span>●</span> Sistema Online

            <b>•</b>

            ReciclaHub • Protótipo

        </footer>

    </div>

</body>

</html>
